name: C++ installed bindings
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facade-binding-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  installed-binding:
    name: C++ installed binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          path: abstraction-facade
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: abstraction-facade/go/go.mod
          cache: false
      - name: select verified Windows Go SDK and smoke duplex pipes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python3 abstraction-facade/tools/windows_go_sdk.py --cache-dir "$RUNNER_TEMP/windows-go-sdk" --github-env --smoke-dir "$RUNNER_TEMP/windows-go-smoke" > windows-go-sdk-proof.json
          printf '\n### Verified Windows Go SDK and duplex race smoke\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat windows-go-sdk-proof.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: preserve Windows Go SDK source identity and smoke
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-go-sdk-${{ github.job }}-${{ github.run_attempt }}
          path: |
            windows-go-sdk-proof.json
            ${{ runner.temp }}/windows-go-smoke/named-pipe-race.log
            ${{ runner.temp }}/windows-go-smoke/smoke-receipt.json
          if-no-files-found: error
      - name: resolve released sibling versions
        id: siblings
        env:
          MODULE: abstraction-facade/go
          SIBLINGS: abstraction-identity abstraction-job abstraction-logging abstraction-config abstraction-router abstraction-storage abstraction-model abstraction-download
        run: |
          # Each sibling at the release tag of the version this repository's
          # go.mod requires: the dependency is declared once, in the manifest,
          # and CI builds what an adopter of those versions builds (VISION
          # 2026-10-08). A repository's C++ sources ship at its Go module's tag:
          # go/vX for a module under go/, vX for a root module. It runs with the
          # Go toolchain setup-go installed, which every runner and the stage have.
          mkdir -p "$RUNNER_TEMP/siblings"
          cat > "$RUNNER_TEMP/siblings/main.go" <<'GO'
          package main

          import (
          	"encoding/json"
          	"fmt"
          	"os"
          	"os/exec"
          	"regexp"
          	"strings"
          )

          func main() {
          	cmd := exec.Command("go", "mod", "edit", "-json")
          	cmd.Dir = os.Args[1]
          	raw, err := cmd.Output()
          	if err != nil {
          		fmt.Fprintln(os.Stderr, "FAIL go mod edit -json in", os.Args[1]+":", err)
          		os.Exit(1)
          	}
          	var module struct{ Require []struct{ Path, Version string } }
          	if err := json.Unmarshal(raw, &module); err != nil {
          		fmt.Fprintln(os.Stderr, "FAIL", err)
          		os.Exit(1)
          	}
          	sibling := regexp.MustCompile(`^github\.com/openabstractions/(abstraction-[a-z0-9-]+)(?:/(.+))?$`)
          	pseudo := regexp.MustCompile(`\d{14}-[0-9a-f]{12}$`)
          	tags, ranks := map[string]string{}, map[string]int{}
          	for _, r := range module.Require {
          		m := sibling.FindStringSubmatch(r.Path)
          		if m == nil {
          			continue
          		}
          		rank, tag := 1, r.Version
          		if m[2] != "" {
          			rank, tag = 2, m[2]+"/"+r.Version
          			if m[2] == "go" {
          				rank = 0
          			}
          		}
          		if old, ok := ranks[m[1]]; !ok || rank < old {
          			tags[m[1]], ranks[m[1]] = tag, rank
          		}
          	}
          	var lines, problems []string
          	for _, name := range os.Args[2:] {
          		tag := tags[name]
          		switch {
          		case tag == "":
          			problems = append(problems, name+" is not required by "+os.Args[1]+"/go.mod; declare its released version there")
          		case pseudo.MatchString(tag):
          			problems = append(problems, name+" "+tag+" is a pseudo-version, not a released tag")
          		}
          		lines = append(lines, strings.TrimPrefix(name, "abstraction-")+"="+tag)
          	}
          	if len(problems) > 0 {
          		fmt.Fprintln(os.Stderr, "FAIL "+strings.Join(problems, "\nFAIL "))
          		os.Exit(1)
          	}
          	output, err := os.OpenFile(os.Getenv("GITHUB_OUTPUT"), os.O_APPEND|os.O_WRONLY, 0)
          	if err != nil {
          		fmt.Fprintln(os.Stderr, "FAIL", err)
          		os.Exit(1)
          	}
          	defer output.Close()
          	fmt.Fprint(output, strings.Join(lines, "\n")+"\n")
          	fmt.Println(strings.Join(lines, "\n"))
          }
          GO
          go run "$RUNNER_TEMP/siblings/main.go" "$MODULE" $SIBLINGS
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-identity
          ref: ${{ steps.siblings.outputs.identity }}
          path: abstraction-identity
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-job
          ref: ${{ steps.siblings.outputs.job }}
          path: abstraction-job
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-logging
          ref: ${{ steps.siblings.outputs.logging }}
          path: abstraction-logging
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-config
          ref: ${{ steps.siblings.outputs.config }}
          path: abstraction-config
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-router
          ref: ${{ steps.siblings.outputs.router }}
          path: abstraction-router
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-storage
          ref: ${{ steps.siblings.outputs.storage }}
          path: abstraction-storage
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-model
          ref: ${{ steps.siblings.outputs.model }}
          path: abstraction-model
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: openabstractions/abstraction-download
          ref: ${{ steps.siblings.outputs.download }}
          path: abstraction-download
          persist-credentials: false
      - name: record source revisions
        run: |
          test "$(git -C abstraction-facade rev-parse HEAD)" = "$GITHUB_SHA"
          for repo in facade identity job logging config router storage model download; do
            printf 'abstraction-%s %s %s\n' "$repo" "$(git -C "abstraction-$repo" describe --tags --exact-match 2>/dev/null || echo -)" \
              "$(git -C "abstraction-$repo" rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: install aggregate bindings
        run: |
          cmake -S abstraction-facade/cpp -B "$RUNNER_TEMP/binding-build" \
            -DCMAKE_BUILD_TYPE=Release -DABSTRACTION_FACADE_BUILD_AGGREGATE=ON \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/binding-install"
          cmake --build "$RUNNER_TEMP/binding-build" --config Release
          cmake --install "$RUNNER_TEMP/binding-build" --config Release
      - name: test installed bindings
        run: |
          cp -R abstraction-facade/cpp/test/binding "$RUNNER_TEMP/binding-consumer-source"
          cmake -S "$RUNNER_TEMP/binding-consumer-source" -B "$RUNNER_TEMP/binding-consumer" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/binding-install"
          cmake --build "$RUNNER_TEMP/binding-consumer" --config Release
          ctest --test-dir "$RUNNER_TEMP/binding-consumer" -C Release --output-on-failure --no-tests=error
          if [ "$RUNNER_OS" = Windows ]; then
            printf 'Windows: installed consumer, delayed resolver/provider shared budget, legacy reuse, expired-before-open, selected-endpoint and refusal fixtures passed.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s: installed consumer, semantic validation and expired-before-open passed. Delayed resolver/provider fixtures are Windows-only in this suite.\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
          fi
